# dsh-plugin-design — bundle patch layer
#
# package.json 声明 `dsh.bundle.patch: "./cordis.patch.yml"`，因此本文件既是
# 官方 bundle 组合层（`dsh plugin --profile web add <本包>` 会选择它），也可
# 手工合并进 profile 的 cordis.patch.yml。
#
# 挂载效果：
#   - Host 半体（12 个 dshpd_* 工具）→ 全局工具
#   - Client 半体（settings.section 设置页）→ 全局 UI（dsh-client-modules 扫描 dsh.client）
#
# 前置：本包必须可被 node_modules 解析（官方 `dsh plugin add`，或
#       $DSH_HOME/profiles/node_modules/dsh-plugin-design -> 本目录）。
#
# 注意：客户端半体只挂在“name 恰为裸包名”的那一行上，不要用子路径挂载本行。
- insert:
    - id: dsh-plugin-design
      name: 'dsh-plugin-design'
