manifestVersion: 1

plugin:
  id: com.example.dsh.plugin-design
  name: dsh plugin design
  version: 1.2.2
  description: >-
    DSH 第三方插件规范分析、自动修改与开发元插件：发现、检查、静态分析（官方
    package.json.dsh 契约 0.2.x + DH-TP-SDK）、生成 design.md、审批门控、
    备份/逐项修改/清单迁移/校验/回滚，并提供 Settings UI。

runtime:
  harness:
    min: 0.1.5-rc.1
    max: "<0.3.0"

  node:
    min: 22
    max: "<25"

cordis:
  apiLevel: 1

capabilities:
  provides:
    - com.example.dsh.plugin-design.tool.dshpd_discover
    - com.example.dsh.plugin-design.tool.dshpd_inspect
    - com.example.dsh.plugin-design.tool.dshpd_analyze
    - com.example.dsh.plugin-design.tool.dshpd_ui_check
    - com.example.dsh.plugin-design.tool.dshpd_design
    - com.example.dsh.plugin-design.tool.dshpd_approve
    - com.example.dsh.plugin-design.tool.dshpd_backup
    - com.example.dsh.plugin-design.tool.dshpd_apply
    - com.example.dsh.plugin-design.tool.dshpd_migrate
    - com.example.dsh.plugin-design.tool.dshpd_verify
    - com.example.dsh.plugin-design.tool.dshpd_rollback
    - com.example.dsh.plugin-design.tool.dshpd_status
    - com.example.dsh.plugin-design.tool.dshpd_report
    - com.example.dsh.plugin-design.route.info
    - com.example.dsh.plugin-design.route.discover
    - com.example.dsh.plugin-design.route.analyze
    - com.example.dsh.plugin-design.slot.settings.section

  consumes:
    - ctx.tools
    - ctx.fs
    - ctx.webServer
    - ctx.sandboxPolicy
    - ctx.slots
    - ctx.uiWorkspace

events:
  subscribes: []

  waterfall: []

permissions:
  filesystem:
    read:
      - workspace/**
    write:
      - workspace/**

  network:
    outbound: false
    hosts: []

  subprocess:
    enabled: false

  shell:
    enabled: false

  credentials:
    access: false

resources:
  maxRuntimeMs: 30000
  maxMemoryMb: 512
  maxOutputBytes: 1048576
  maxProcesses: 1
  maxConcurrentTasks: 12

lifecycle:
  unloadable: true
  reversible: true

session:
  modelVisibleState: false
  durableState: false

profiles:
  supported:
    - web

security:
  level: S2
  sandboxRequired: true

compatibility:
  apiLevelPolicy: strict
  breakingChangesPolicy: semver
